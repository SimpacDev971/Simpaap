packages:
  - '.'

# pnpm >= 11: build scripts are blocked unless explicitly allowed
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  '@tsparticles/engine': false
  unrs-resolver: false
  # Optional native bindings: ssh2 falls back to pure JS
  ssh2: false
  cpu-features: false
